[package]
name = "gitview-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Git 資料讀取與圖形佈局計算，不含任何介面相依。"

[dependencies]
anyhow = { workspace = true, optional = true }
git2 = { workspace = true, optional = true }

[features]
default = ["git"]
# 讀取真實 repository 的能力。關閉後本 crate 不含任何相依，
# 圖形佈局可在沒有 C 工具鏈的環境下單獨建置與測試。
git = ["dep:git2", "dep:anyhow"]
